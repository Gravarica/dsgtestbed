tool: Claude Code
model: Claude Opus 5 (1M context)
mode: autonomous
result: verified
proof: Every one of the 200 documents at default settings decompresses back to its own text with a term index
  that holds every word and word pair at exactly the positions where they occur, and the record is packed at
  least 2.5 times smaller than its JSON form.
notes: One item takes about 1.3 ms, so this is a cheap service, good for high rates; all three knobs move the
  time. The documents are cut at a character count, so at data_quality below 100 the last word of a document
  can be cut in half. That is deliberate and deterministic.
