name: face-detector
asked_by: ""
date: 2026-10-12
task: Detect the faces in each image and return their boxes and scores, at the frame height the knob asks
  for, so that a larger frame takes longer.
data: {source: reuse, from: face-detector/v1, files: the sample images with known faces; models with a public
  licence fetched by prepare.sh}
knobs:
  - {name: data_quality, type: int, min: 160, max: 640, default: 320}
  - {name: model_size, type: int, min: 1, max: 2, default: 1}
limits: {memory: 8g, packages: no PyTorch}
