name: audio-encoder
asked_by: ""
date: 2026-10-12
task: Encode each audio clip into a compressed file and return the encoded bytes.
data: {source: reuse, from: speech-transcriber/v1, files: LibriSpeech dev-clean clips of at least 12 seconds
  (CC BY 4.0); copied or fetched by prepare.sh}
knobs:
  - {name: data_quality, type: int, min: 2, max: 12, default: 6}
  - {name: format, type: choice, values: [flac, ogg], default: flac}
limits: {memory: 8g, packages: no PyTorch}
