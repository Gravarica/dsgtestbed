name: qr-detector
asked_by: ""
date: 2026-09-20
task: Find and decode the QR code in each video frame and draw it on the frame. Ported from elastic-workbench QrDetector.
data: {source: reuse, from: elastic-workbench, files: [QR_Video.mp4]}
knobs:
