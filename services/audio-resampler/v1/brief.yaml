name: audio-resampler
asked_by: ""
date: 2026-10-12
task: Prepare each audio clip for the next stage by resampling it to the target rate, removing its offset and
  normalising its loudness, and return the prepared samples.
data: {source: reuse, from: speech-transcriber/v1, files: LibriSpeech dev-clean clips of at least 12 seconds
  (CC BY 4.0); copied or fetched by prepare.sh}
knobs:
  - {name: data_quality, type: int, min: 2, max: 12, default: 6}
  - {name: target_rate, type: choice, values: ["8000", "22050", "44100"], default: "22050"}
limits: {memory: 8g, packages: no PyTorch}
