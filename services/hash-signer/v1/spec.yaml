name: hash-signer
version: v1
service_type: hash-signer
input: any
output: bytes
sample_count: 30
knobs:
  data_quality: {type: int, min: 1, max: 1024, default: 64}
  algorithm: {type: choice, values: [sha256, sha512, blake2b, sha3_256], default: sha256}
  rounds: {type: int, min: 1000, max: 200000, default: 20000}
