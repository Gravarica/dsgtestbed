tool: Claude Code
model: Claude Opus 5.5 (1M context)
mode: autonomous
result: verified
proof: A real scan aligned with a copy of itself moved by a known turn of one degree and a known shift is found
  again within 0.05 degrees and 1 cm, and consecutive real scans at default settings give proper rotations with a
  median forward motion between 0.2 and 2 m and almost no sideways or vertical motion, as a driving car has.
notes: Written by a sub-agent of the orchestrating Claude Code session from the final brief, with no person
  involved. A sample is the pair (scan i + 1, scan i); scans are cut to data_quality metres, lose their ground
  points and are thinned on a fixed 0.3 m grid before any item, and every item runs exactly `iterations` rounds of
  point-to-point ICP. About 42 ms per item at default settings and about 170 ms at the heaviest; at 6 m only a
  handful of points remain, so an item takes under 1 ms there.
