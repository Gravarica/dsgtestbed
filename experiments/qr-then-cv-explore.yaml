nodes:
  qr:
    service: qr-detector v1
    cores: [2, 3]
    knobs:
      data_quality: [300, 552, 800]
  cv:
    service: cv-analyzer v1
    cores: [2, 4]
    parallelism: [1, 2]
    knobs:
      model_size: [1, 2]
      data_quality: 224
edges:
  - qr -> cv
load:
  rps: [5, 10, 20]
run:
  warmup_seconds: 10
  measure_seconds: 60
  runs: 24
  seed: 0
