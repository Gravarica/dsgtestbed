nodes:
  cv-01:
    service: cv-analyzer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: 1
      data_quality: [128, 160]
  lidar-02:
    service: pc-visualizer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [6, 30, 60]
  camera-03:
    service: image-compressor v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552, 800]
      encoding_quality: [50, 75, 90]
      format: jpeg
  anomaly-04:
    service: anomaly-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: 1
      window_length: [512, 1024, 2048]
      threshold: 3.5
  face-05:
    service: face-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: [1, 2]
  qr-06:
    service: qr-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552]
  face-07:
    service: face-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: [1, 2]
  signer-08:
    service: hash-signer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [1, 4, 16]
      algorithm: [sha256, blake2b]
      rounds: [1000, 3000, 10000]
  audio-09:
    service: audio-features v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [2, 4, 6]
      mel_bands: [20, 40, 64]
      frame_ms: [20, 25, 40]
  camera-10:
    service: image-compressor v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552, 800]
      encoding_quality: [50, 75, 90]
      format: jpeg
edges: [cv-01 -> lidar-02, lidar-02 -> camera-03, camera-03 -> anomaly-04, anomaly-04 -> face-05, face-05 -> qr-06, qr-06 -> face-07, face-07
    -> signer-08, signer-08 -> audio-09, audio-09 -> camera-10]
link: requests
load:
  rps: {from: 5, to: 30, step: 5}
  burst_factor: [1, 2, 4]
  burst_seconds: [1, 2]
run: {warmup_seconds: 12, measure_seconds: 30, runs: 40, seed: 3104}
