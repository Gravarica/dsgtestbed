nodes:
  lidar:
    service: pc-clusterer v1
    cores: {from: 2, to: 4}
    parallelism: [1, 2]
    knobs:
      data_quality: {from: 6, to: 60, step: 6}
      voxel_size: [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0]
      cluster_distance: {from: 0.3, to: 2.0, step: 0.1}
load:
  rps: {from: 2, to: 30.0, step: 2}
  burst_factor: 1
run: {warmup_seconds: 5, measure_seconds: 30, runs: 3, repetitions: 5, seed: 228}
