nodes:
  anomaly-01:
    service: anomaly-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: 1
      window_length: [512, 1024, 2048]
      threshold: 3.5
  camera-02:
    service: image-compressor v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552, 800]
      encoding_quality: [50, 75, 90]
      format: jpeg
  face-03:
    service: face-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: [1, 2]
  qr-04:
    service: qr-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552]
  face-05:
    service: face-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: [1, 2]
  face-06:
    service: face-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: [1, 2]
  agg-07:
    service: sensor-aggregator v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      window_length: [256, 512, 1024]
      channels: [4, 8, 16]
      feature_set: [basic, spectral]
  cluster-08:
    service: pc-clusterer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [10, 20, 30]
      voxel_size: [0.5, 0.75, 1.0]
      cluster_distance: 0.7
  camera-09:
    service: image-compressor v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552, 800]
      encoding_quality: [50, 75, 90]
      format: jpeg
  signer-10:
    service: hash-signer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [1, 4, 16]
      algorithm: [sha256, blake2b]
      rounds: [1000, 3000, 10000]
edges: [anomaly-01 -> camera-02, camera-02 -> face-03, face-03 -> qr-04, qr-04 -> face-05, face-05 -> face-06, face-06 -> agg-07, agg-07 -> cluster-08,
  cluster-08 -> camera-09, camera-09 -> signer-10]
link: requests
load:
  rps: {from: 5, to: 30, step: 5}
  burst_factor: [1, 2, 4]
  burst_seconds: [1, 2]
run: {warmup_seconds: 12, measure_seconds: 30, runs: 40, seed: 3101}
