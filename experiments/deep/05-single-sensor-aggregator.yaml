nodes:
  agg:
    service: sensor-aggregator v1
    cores: {from: 2, to: 4}
    parallelism: [1, 2]
    knobs:
      window_length: [64, 128, 256, 512, 1024, 2048, 4096, 8192]
      channels: [1, 2, 4, 8, 16, 32, 64]
      feature_set: [basic, spectral, full]
load:
  rps: {from: 10, to: 200.0, step: 10}
  burst_factor: 1
run: {warmup_seconds: 5, measure_seconds: 30, runs: 3, repetitions: 5, seed: 221}
