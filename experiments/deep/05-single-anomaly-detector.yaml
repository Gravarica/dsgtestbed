nodes:
  anomaly:
    service: anomaly-detector v1
    cores: {from: 2, to: 4}
    parallelism: [1, 2]
    knobs:
      window_length: [256, 512, 1024, 2048, 4096, 8192, 16384]
      model_size: [1, 2, 3]
      threshold: {from: 2.0, to: 6.0, step: 0.5}
load:
  rps: {from: 1, to: 20.0}
  burst_factor: 1
run: {warmup_seconds: 5, measure_seconds: 30, runs: 3, repetitions: 5, seed: 222}
