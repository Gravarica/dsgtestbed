nodes:
  camera:
    service: image-compressor v1
    cores: {from: 2, to: 4}
    parallelism: [1, 2]
    knobs:
      data_quality: {from: 100, to: 1000, step: 50}
      encoding_quality: {from: 10, to: 95, step: 5}
      format: [jpeg, webp, png]
load:
  rps: {from: 2, to: 60.0, step: 2}
  burst_factor: 1
run: {warmup_seconds: 5, measure_seconds: 30, runs: 3, repetitions: 5, seed: 223}
