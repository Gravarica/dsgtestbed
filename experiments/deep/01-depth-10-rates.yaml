nodes:
  signer-01:
    service: hash-signer v1
    cores: 0.5
    knobs: {data_quality: 4, algorithm: sha256, rounds: 3000}
  agg-02:
    service: sensor-aggregator v1
    cores: 0.5
    knobs: {window_length: 512, channels: 8, feature_set: basic}
  audio-03:
    service: audio-features v1
    cores: 0.5
    knobs: {data_quality: 4, mel_bands: 40, frame_ms: 25}
  logs-04:
    service: log-parser v1
    cores: 0.5
    knobs: {data_quality: 200, pattern_count: 20}
  idx-05:
    service: text-indexer v1
    cores: 0.5
    knobs: {data_quality: 50, compression_level: 6, ngram_size: 2}
  face-06:
    service: face-detector v1
    cores: 0.5
    knobs: {model_size: 1}
  lidar-07:
    service: pc-visualizer v1
    cores: 0.5
    knobs: {data_quality: 30}
  camera-08:
    service: image-compressor v1
    cores: 0.5
    knobs: {data_quality: 552, encoding_quality: 75, format: jpeg}
  signer-09:
    service: hash-signer v1
    cores: 0.5
    knobs: {data_quality: 4, algorithm: sha256, rounds: 3000}
  agg-10:
    service: sensor-aggregator v1
    cores: 0.5
    knobs: {window_length: 512, channels: 8, feature_set: basic}
edges: [signer-01 -> agg-02, agg-02 -> audio-03, audio-03 -> logs-04, logs-04 -> idx-05, idx-05 -> face-06, face-06 -> lidar-07, lidar-07 -> camera-08,
  camera-08 -> signer-09, signer-09 -> agg-10]
link: rates
load:
  rps: [5, 10, 20]
  burst_factor: [1, 2, 4]
  burst_seconds: 1
run: {warmup_seconds: 12, measure_seconds: 30, repetitions: 1, seed: 1010}
