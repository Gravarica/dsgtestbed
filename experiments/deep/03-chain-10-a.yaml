nodes:
  lidar-01:
    service: pc-visualizer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [6, 30, 60]
  tables-02:
    service: table-joiner v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [1000, 3000, 10000]
      group_count: [10, 100, 1000]
  audio-03:
    service: audio-features v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [2, 4, 6]
      mel_bands: [20, 40, 64]
      frame_ms: [20, 25, 40]
  lidar-04:
    service: pc-visualizer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [6, 30, 60]
  anomaly-05:
    service: anomaly-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      model_size: 1
      window_length: [512, 1024, 2048]
      threshold: 3.5
  qr-06:
    service: qr-detector v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552]
  logs-07:
    service: log-parser v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [100, 200, 500]
      pattern_count: [5, 20, 50]
  signer-08:
    service: hash-signer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [1, 4, 16]
      algorithm: [sha256, blake2b]
      rounds: [1000, 3000, 10000]
  lidar-09:
    service: pc-visualizer v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [6, 30, 60]
  camera-10:
    service: image-compressor v1
    cores: {from: 0.5, to: 1.5, step: 0.25}
    knobs:
      data_quality: [300, 552, 800]
      encoding_quality: [50, 75, 90]
      format: jpeg
edges: [lidar-01 -> tables-02, tables-02 -> audio-03, audio-03 -> lidar-04, lidar-04 -> anomaly-05, anomaly-05 -> qr-06, qr-06 -> logs-07, logs-07
    -> signer-08, signer-08 -> lidar-09, lidar-09 -> camera-10]
link: requests
load:
  rps: {from: 5, to: 30, step: 5}
  burst_factor: [1, 2, 4]
  burst_seconds: [1, 2]
run: {warmup_seconds: 12, measure_seconds: 30, runs: 40, seed: 3100}
