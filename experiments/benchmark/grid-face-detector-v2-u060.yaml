nodes:
  service:
    service: face-detector v2
    discipline: fifo
    cores: 8
    parallelism: 1
    knobs:
      data_quality: {from: 160, to: 640, step: 32}
      model_size: [1, 2]
link: requests
load: {utilization: 0.6}
run: {warmup_seconds: 10, measure_seconds: 30, measure_requests: 400, longest_measure_seconds: 180, probe_seconds: 8, cpu_slack: 1.15, queue_capacity: 1000000,
  seed: 200}
