nodes:
  qr:
    service: qr-detector v1
    cores: 2
    knobs:
      data_quality: 552
  face:
    service: face-detector v1
    cores: 2
    knobs:
      model_size: 1
edges:
  - qr -> face
link: requests                 # every finished request is handed to the next service; the default is rates
load:
  rps: 30
run:
  warmup_seconds: 5
  measure_seconds: 30
