nodes:
  qr:
    service: qr-detector v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {data_quality: {from: 300, to: 800, step: 50}}
  cv:
    service: cv-analyzer v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {model_size: [1, 2], data_quality: [128, 160, 224, 256, 320]}
  face:
    service: face-detector v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {model_size: [1, 2]}
  idx:
    service: text-indexer v1
    cores: {from: 1, to: 3}
    knobs: {data_quality: {from: 10, to: 100, step: 10}, compression_level: {from: 1, to: 9}, ngram_size: [1, 2, 3]}
edges: [qr -> cv, qr -> face, cv -> idx, face -> idx]
link: requests
load:
  rps: {from: 2, to: 20, step: 2}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 100, seed: 51}
