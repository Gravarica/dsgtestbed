nodes:
  camera:
    service: image-compressor v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {data_quality: {from: 200, to: 1000, step: 100}, encoding_quality: {from: 10, to: 95, step: 5}, format: [jpeg, webp]}
  face:
    service: face-detector v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {model_size: [1, 2]}
  cv:
    service: cv-analyzer v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {model_size: [1, 2], data_quality: [128, 160, 224, 256, 320]}
  signer:
    service: hash-signer v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {data_quality: [1, 4, 16, 64, 256], algorithm: [sha256, sha512, blake2b, sha3_256], rounds: [1000, 3000, 10000, 30000]}
  agg:
    service: sensor-aggregator v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {window_length: [256, 512, 1024, 2048, 4096], channels: [4, 8, 16, 32, 64], feature_set: [basic, spectral, full]}
edges: [camera -> face, face -> cv, cv -> signer, signer -> agg]
link: requests
load:
  rps: {from: 2, to: 20, step: 2}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 50, seed: 48}
