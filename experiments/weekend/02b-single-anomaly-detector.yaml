nodes:
  anomaly:
    service: anomaly-detector v1
    cores: {from: 1, to: 5}
    parallelism: {from: 1, to: 4}
    knobs:
      window_length: [256, 512, 1024, 2048, 4096, 8192, 16384]
      model_size: [1, 2, 3]
      threshold: {from: 2.0, to: 6.0, step: 0.5}
load:
  rps: {from: 1, to: 40}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 60, repetitions: 3, repeated_share: 0.1, seed: 22}
