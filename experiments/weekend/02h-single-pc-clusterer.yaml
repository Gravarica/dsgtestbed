nodes:
  lidar:
    service: pc-clusterer v1
    cores: {from: 1, to: 5}
    parallelism: {from: 1, to: 4}
    knobs:
      data_quality: {from: 6, to: 60, step: 6}
      voxel_size: [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0]
      cluster_distance: {from: 0.3, to: 2.0, step: 0.1}
load:
  rps: {from: 2, to: 60, step: 2}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 60, repetitions: 3, repeated_share: 0.1, seed: 28}
