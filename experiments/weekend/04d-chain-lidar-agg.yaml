nodes:
  lidar:
    service: pc-clusterer v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {data_quality: {from: 10, to: 60, step: 10}, voxel_size: [0.2, 0.3, 0.5, 0.75, 1.0], cluster_distance: {from: 0.3, to: 2.0, step: 0.1}}
  agg:
    service: sensor-aggregator v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs: {window_length: [256, 512, 1024, 2048, 4096], channels: [4, 8, 16, 32, 64], feature_set: [basic, spectral, full]}
edges: [lidar -> agg]
link: requests
load:
  rps: {from: 2, to: 30, step: 2}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 50, seed: 44}
