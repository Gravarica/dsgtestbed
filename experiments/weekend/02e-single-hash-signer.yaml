nodes:
  signer:
    service: hash-signer v1
    cores: {from: 1, to: 5}
    parallelism: {from: 1, to: 4}
    knobs:
      data_quality: [1, 4, 16, 64, 256, 1024]
      algorithm: [sha256, sha512, blake2b, sha3_256]
      rounds: [1000, 3000, 10000, 30000, 100000, 200000]
load:
  rps: {from: 5, to: 200, step: 5}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 60, repetitions: 3, repeated_share: 0.1, seed: 25}
