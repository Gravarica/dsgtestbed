nodes:
  anomaly:
    service: anomaly-detector v1
    rps: {from: 2, to: 12, step: 2}
    cores: {from: 2, to: 3}
    parallelism: [1, 2]
    knobs:
      window_length: [256, 512, 1024, 2048, 4096]
      model_size: [1, 2]
      threshold: {from: 2.0, to: 6.0, step: 0.5}
  audio:
    service: audio-features v1
    rps: {from: 5, to: 60, step: 5}
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs:
      data_quality: {from: 1, to: 12}
      mel_bands: [20, 40, 64, 128, 256]
      frame_ms: {from: 10, to: 100, step: 10}
  camera:
    service: image-compressor v1
    rps: {from: 5, to: 60, step: 5}
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs:
      data_quality: {from: 200, to: 1000, step: 50}
      encoding_quality: {from: 10, to: 95, step: 5}
      format: [jpeg, webp]
  lidar:
    service: pc-clusterer v1
    rps: {from: 2, to: 20, step: 2}
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs:
      data_quality: {from: 10, to: 60, step: 5}
      voxel_size: {from: 0.2, to: 1.0, step: 0.1}
      cluster_distance: {from: 0.3, to: 2.0, step: 0.1}
  agg-signals:
    service: sensor-aggregator v1
    cores: {from: 1, to: 2}
    knobs:
      window_length: [256, 512, 1024, 2048]
      channels: [4, 8, 16, 32]
      feature_set: [basic, spectral, full]
  agg-vision:
    service: sensor-aggregator v1
    cores: {from: 1, to: 2}
    knobs:
      window_length: [256, 512, 1024, 2048]
      channels: [4, 8, 16, 32]
      feature_set: [basic, spectral, full]
  final:
    service: sensor-aggregator v1
    cores: {from: 1, to: 3}
    parallelism: [1, 2]
    knobs:
      window_length: [256, 512, 1024]
      channels: [4, 8, 16]
      feature_set: [basic, spectral]
edges: [anomaly -> agg-signals, audio -> agg-signals, camera -> agg-vision, lidar -> agg-vision, agg-signals -> final, agg-vision -> final]
link: rates
load:
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 60, seed: 91}
