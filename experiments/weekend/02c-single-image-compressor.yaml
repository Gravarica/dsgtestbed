nodes:
  camera:
    service: image-compressor v1
    cores: {from: 1, to: 5}
    parallelism: {from: 1, to: 4}
    knobs:
      data_quality: {from: 100, to: 1000, step: 50}
      encoding_quality: {from: 10, to: 95, step: 5}
      format: [jpeg, webp, png]
load:
  rps: {from: 2, to: 120, step: 2}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 60, repetitions: 3, repeated_share: 0.1, seed: 23}
