nodes:
  camera: {service: image-compressor v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {data_quality: [300, 552, 800], format: jpeg}}
  qr: {service: qr-detector v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {data_quality: [300, 552]}}
  face: {service: face-detector v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {model_size: 1}}
  signer: {service: hash-signer v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {rounds: [1000, 10000]}}
  logs: {service: log-parser v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {data_quality: [200, 500]}}
  tables: {service: table-joiner v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {data_quality: [1000, 10000]}}
  idx: {service: text-indexer v1, cores: {from: 1, to: 2.5, step: 0.5}}
  audio: {service: audio-features v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {data_quality: [2, 6]}}
  lidar: {service: pc-visualizer v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {data_quality: [10, 30]}}
  agg: {service: sensor-aggregator v1, cores: {from: 1, to: 2.5, step: 0.5}, knobs: {window_length: [256, 1024], channels: [8, 16]}}
edges: [camera -> qr, qr -> face, face -> signer, signer -> logs, logs -> tables, tables -> idx, idx -> audio, audio -> lidar, lidar -> agg]
link: requests
load:
  rps: {from: 5, to: 40, step: 5}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 80, seed: 62}
