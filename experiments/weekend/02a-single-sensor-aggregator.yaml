nodes:
  agg:
    service: sensor-aggregator v1
    cores: {from: 1, to: 5}
    parallelism: {from: 1, to: 4}
    knobs:
      window_length: [64, 128, 256, 512, 1024, 2048, 4096, 8192]
      channels: [1, 2, 4, 8, 16, 32, 64]
      feature_set: [basic, spectral, full]
load:
  rps: {from: 10, to: 400, step: 10}
  burst_factor: [1, 2, 4, 8]
  burst_seconds: [1, 2]
run: {warmup_seconds: 5, measure_seconds: 30, runs: 60, repetitions: 3, repeated_share: 0.1, seed: 21}
