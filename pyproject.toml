[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dsg-testbed"
version = "0.2.0"
description = "Testbed that runs containerized services under controlled load and records every item."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6",
    "pandas>=2",
    "requests>=2.31",
    "flask>=3.0",
    "prometheus-client>=0.16",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
dsg = "dsg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: needs Docker and a built qr-detector image"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dsg = ["load_generator/patterns/*.csv", "monitor/stack/*", "service_generator/service.Dockerfile"]
